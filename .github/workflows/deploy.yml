name: Build and Deploy Angular App

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Tests
      run: npx ng test --watch=false --browsers=ChromeHeadless

    - name: Configure npm Authentication
      run: echo "//registry.npmjs.org/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc

    - name: Build Project
      run: npm run deploy
       
    - name: Add CNAME
      run: |
        cp CNAME ./dist/home-page/CNAME

    # Every route is prerendered; 404.html is the client-only shell for anything else.
    - name: Add 404 Fallback
      run: |
        cp ./dist/home-page/index.csr.html ./dist/home-page/404.html

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist/home-page  
