@if (shouldShow() && gamesPerDate()?.games?.length > 0) {
  <div class="sport-panel">
    <div class="sport-title">{{ this.isBasketball() ? 'Basketball' : 'Football' }}</div>
    <div class="sport-game-ctn">
      <div class="date-nav">
        <button type="button" class="day-arrow prev-day" aria-label="Previous game day"
                [disabled]="!canStep(false)" (click)="step(false)">&#8249;</button>
        @if (isBrowsing()) {
          <button type="button" class="date-label browsing" title="Back to current games"
                  (click)="backToCurrent()">{{ shown().date }}</button>
        } @else {
          <span class="date-label">{{ shown().date }}</span>
        }
        <button type="button" class="day-arrow next-day" aria-label="Next game day"
                [disabled]="!canStep(true)" (click)="step(true)">&#8250;</button>
      </div>
      @for (game of shown().games; track game) {
        <div class="game-row">
          <div class="column away-label right" [title]="game.opponent" (click)="imgClick(game, false)">{{ game.opponent }}</div>
          <div class="column at-label">&#64;</div>
          <div class="column home-label left" [title]="game.home" (click)="imgClick(game)">{{ game.home }}</div>
          <div class="column time-label">{{ this.liveTime(game.time) }}</div>
        </div>
      }
    </div>
  </div>
}
